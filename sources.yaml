# ---------------------------------------------------------------------------
# sources.yaml — where the agent looks.
#
# Slugs below are a seed list built from public ATS patterns. Companies change
# ATS providers, so some entries WILL be wrong on day one. That is expected and
# handled: run `python agent.py --check-sources` and it prints a pass/fail table.
# Send me the failures and I'll fix them, or run `--discover "Company Name"` and
# the agent will find the right endpoint itself.
#
# Adding a company later: run --discover, paste the line it gives you.
# ---------------------------------------------------------------------------

