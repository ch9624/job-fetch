# --- Workday: POST https://{host}/wday/cxs/{tenant}/{site}/jobs
#     Find these by opening a company's careers site and reading the URL.
workday:
  - company: Salesforce
    host: salesforce.wd12.myworkdayjobs.com
    tenant: salesforce
    site: External_Career_Site
  - company: NVIDIA
    host: nvidia.wd5.myworkdayjobs.com
    tenant: nvidia
    site: NVIDIAExternalCareerSite
  - company: Adobe
    host: adobe.wd5.myworkdayjobs.com
    tenant: adobe
    site: external_experienced
  - company: PayPal
    host: paypal.wd1.myworkdayjobs.com
    tenant: paypal
    site: jobs
  - company: ServiceNow
    host: servicenow.wd1.myworkdayjobs.com
    tenant: servicenow
    site: careers
  - company: Zoom
    host: zoomvideocommunications.wd5.myworkdayjobs.com
    tenant: zoomvideocommunications
    site: Zoom
  - company: Workday
    host: workday.wd5.myworkdayjobs.com
    tenant: workday
    site: Workday

# --- MyCareersFuture (Singapore government portal)
mycareersfuture:
  enabled: true
  # One search per line. Kept broad; the title filter and rubric do the narrowing.
  queries:
    - finance manager
    - financial controller
    - business controller
    - finance business partner
    - FP&A manager
    - senior finance manager
  # Minimum posted salary in SGD/month to include. 0 = no filter.
  min_salary_monthly: 9000

# --- Search firms. No stable public API. The agent builds direct search URLs
