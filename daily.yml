name: Daily job fetch

# Fetches and filters postings every morning and commits digests/<date>.to-score.json.
# No API key, no email. Scoring happens in Cowork, which reads that file from this repo.

on:
  schedule:
    # 23:00 UTC = 07:00 SGT next morning. Mon-Sat (Sunday postings are thin).
    - cron: "0 23 * * 0-5"

  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: fetch
        type: choice
        options:
          - fetch
          - check-sources
          - rediscover
          - dry-run
          - digest

permissions:
  contents: write

concurrency:
  group: job-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent
        env:
          MODE: ${{ inputs.mode || 'fetch' }}
          # All optional. Leave every secret unset for the Cowork path.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          case "$MODE" in
            check-sources) python agent.py --check-sources          | tee -a "$GITHUB_STEP_SUMMARY" ;;
            rediscover)    python agent.py --rediscover             | tee -a "$GITHUB_STEP_SUMMARY" ;;
            dry-run)       python agent.py --no-score --dry-run     | tee -a "$GITHUB_STEP_SUMMARY" ;;
            digest)        python agent.py                          | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *)             python agent.py --no-score               | tee -a "$GITHUB_STEP_SUMMARY" ;;
          esac
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save state and today's postings
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'fetch' || inputs.mode == 'digest' }}
        run: |
          git config user.name  "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git add state.json digests/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "fetch $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin HEAD 2>/dev/null || true
          git push
